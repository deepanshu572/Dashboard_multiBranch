<!DOCTYPE html>
<html lang="en">


<!-- Mirrored from /dashboard/ by HTTrack Website Copier/3.x [XR&CO'2014], Tue, 05 May 2026 18:40:06 GMT -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/index.css">
</head>

<body>
    <div class="overlay">
        <!-- <img src="assets/images/Intro (3).png" alt="img"> -->
    </div>
    <div class="box">
        <div class="form">
            <div class="input-box">
                <h2>Sign In</h2>
                <input type="text" required id="username">
                <span>Username</span>
                <i></i>
            </div>
            <div class="input-box">
                <input type="password" required id="password">

                <span>Enter Password</span>

                <i></i>
                <div class="eyes">
                    <i class="bi bi-eye-slash"></i>
                </div>
            </div>
            <input type="submit" onclick="adminLogin()" value="Login">
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/script.js"></script>
    <script>

        $(".eyes").click(() => {
            if ($(".eyes i").hasClass("bi-eye-slash")) {
                $(".eyes i").removeClass("bi-eye-slash").addClass("bi-eye");
                $("#password").attr("type", "text");
            } else {
                $(".eyes i").removeClass("bi-eye").addClass("bi-eye-slash");
                $("#password").attr("type", "password");
            }
        })



        let status = localStorage.getItem('admin_login_status');

        if (status == 'true') {
            location.href = 'pages/dashboard.html';
        }

    </script>
</body>
</html>
